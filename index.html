// Mahsulotlarga rasm biriktirish

let id = 0;

const products = Object.entries(data).flatMap(([category,items]) =>
  items.map((item,index) => {
    id++;

    let image;

    if(category === "Ichimliklar") {
      image = drinkImages[item[0]];
    } else {
      image = categoryImages[category]?.[index];
    }

    return {
      id,
      name: item[0],
      price: item[1],
      description: item[2],
      category,
      image
    };
  })
);

const categories = [
"Barchasi","Kombo","Pitsa","Gazaklar",
"Ichimliklar","Salatlar","Desertlar","Souslar"
];

function formatPrice(price) {
  return price.toLocaleString("uz-UZ") + " so'm";
}

// APP

function App() {

  const [category,setCategory] = useState("Barchasi");
  const [search,setSearch] = useState("");
  const [cart,setCart] = useState([]);
  const [cartOpen,setCartOpen] = useState(false);

  const filteredProducts = products.filter(product => {
    const categoryMatch =
      category === "Barchasi" || product.category === category;

    const searchMatch =
      product.name.toLowerCase().includes(search.toLowerCase());

    return categoryMatch && searchMatch;
  });

  function addToCart(product) {
    setCart(previous => {
      const found = previous.find(item => item.id === product.id);

      if(found) {
        return previous.map(item =>
          item.id === product.id
            ? {...item,quantity:item.quantity+1}
            : item
        );
      }

      return [...previous,{...product,quantity:1}];
    });
  }

  function changeQuantity(id,amount) {
    setCart(previous =>
      previous
        .map(item =>
          item.id === id
            ? {...item,quantity:item.quantity+amount}
            : item
        )
        .filter(item => item.quantity > 0)
    );
  }

  const total = cart.reduce(
    (sum,item) => sum + item.price * item.quantity, 0
  );

  const cartCount = cart.reduce(
    (sum,item) => sum + item.quantity, 0
  );

  return (
    <>

      <header>
        <div className="logo">🍕 BELLISSIMO PIZZA</div>

        <nav>
          <a href="#home">Bosh sahifa</a>
          <a href="#menu">Menyu</a>
          <a href="#about">Biz haqimizda</a>
        </nav>

        <button className="cart-button"
          onClick={() => setCartOpen(true)}>
          🛒 Savatcha ({cartCount})
        </button>
      </header>

      <section className="hero" id="home">
        <div className="hero-content">
          <span className="hero-label">BELLISSIMO PIZZA</span>

          <h1>Eng mazali pitsa sizni kutmoqda!</h1>

          <p>
            Sevimli taomingizni tanlang. Yangi tayyorlangan
            mazali pitsalar va boshqa taomlar sizni kutmoqda.
          </p>

          <a href="#menu" className="hero-button">
            Menyuni ko‘rish →
          </a>
        </div>
      </section>

      <main className="container" id="menu">

        <div className="section-heading">
          <div>
            <h2 className="section-title">Bizning menyu 🍕</h2>
            <p className="section-subtitle">
              Sevimli taomingizni tanlang
            </p>
          </div>
        </div>

        <div className="categories">
          {categories.map(item => (
            <button
              key={item}
              className={category === item ? "category active" : "category"}
              onClick={() => setCategory(item)}
            >
              {item}
            </button>
          ))}
        </div>

        <div className="search-wrapper">
          <span className="search-icon">⌕</span>
          <input
            className="search"
            type="search"
            placeholder="Mahsulot nomini qidiring..."
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
        </div>

        <div className="products">

          {filteredProducts.length ? (
            filteredProducts.map(product => (
              <article className="product" key={product.id}>

                <img
                  className="product-image"
                  src={product.image}
                  alt={product.name}
                  loading="lazy"
                  onError={e => {
                    e.currentTarget.onerror = null;
                    e.currentTarget.src =
                      "https://placehold.co/600x400/f1f1f1/555?text=" +
                      encodeURIComponent(product.name);
                  }}
                />

                <div className="product-info">
                  <h3>{product.name}</h3>

                  <p className="description">
                    {product.description}
                  </p>

                  <div className="product-bottom">
                    <span className="price">
                      {formatPrice(product.price)}
                    </span>

                    <button
                      className="add-button"
                      onClick={() => addToCart(product)}
                    >
                      + Qo‘shish
                    </button>
                  </div>
                </div>

              </article>
            ))
          ) : (
            <p className="empty">
              😕 Mahsulot topilmadi. Boshqa nom bilan qidirib ko‘ring.
            </p>
          )}

        </div>
      </main>

      {/* SAVATCHA */}

      {cartOpen && (
        <>
          <div className="cart-overlay"
            onClick={() => setCartOpen(false)}>
          </div>

          <aside className="cart-panel">

            <div className="cart-header">
              <h2>🛒 Savatcha</h2>

              <button className="close-button"
                onClick={() => setCartOpen(false)}>
                ×
              </button>
            </div>

            {cart.length === 0 ? (
              <div className="cart-empty">
                <span>🛒</span>
                Savatchangiz hozircha bo‘sh.
              </div>
            ) : (
              <>
                {cart.map(item => (
                  <div className="cart-item" key={item.id}>

                    <img src={item.image} alt={item.name}/>

                    <div className="cart-item-info">
                      <h4>{item.name}</h4>

                      <span className="price">
                        {formatPrice(item.price * item.quantity)}
                      </span>

                      <div className="quantity">
                        <button onClick={() =>
                          changeQuantity(item.id,-1)}>
                          −
                        </button>

                        <span>{item.quantity}</span>

                        <button onClick={() =>
                          changeQuantity(item.id,1)}>
                          +
                        </button>
                      </div>
                    </div>

                    <button className="remove-button"
                      title="O‘chirish"
                      onClick={() =>
                        setCart(previous =>
                          previous.filter(p => p.id !== item.id)
                        )}>
                      🗑
                    </button>

                  </div>
                ))}

                <div className="total">
                  <span>Jami:</span>
                  <span>{formatPrice(total)}</span>
                </div>

                <button className="order-button"
                  onClick={() =>
                    alert("Buyurtma tizimi hali ulanmagan! Muhammadqodir Gulomov demoday IT bo'yicha Ota-Ona majlisiga web-sayitni taqdim etish uchun tayyorlangan edi")}>
                  Buyurtma berish
                </button>
              </>
            )}

          </aside>
        </>
      )}

      {/* FOOTER */}

      <footer id="about">

        <div className="footer-container">

          <div>
            <div className="footer-logo">
              🍕 Bellissimo<br/>
              <span>Pizza</span>
            </div>

            <p className="footer-phone">
              RAQAMGA QO‘NG‘IROQ QILING<br/>
              <strong>1174</strong>
            </p>
          </div>

          <div className="footer-column">
            <h3>Ma'lumot</h3>
            <a href="#about">Biz haqimizda</a>
            <a href="#menu">Menyu</a>
            <a href="#about">Maxfiylik siyosati</a>
            <a href="#about">Restoranlar</a>
          </div>

          <div className="footer-column">
            <h3>Hamkorlik</h3>
            <a href="#about">Biz bilan ishlash</a>
            <a href="#about">Ish o‘rinlari</a>
            <a href="#about">Yetkazib berish</a>
          </div>

          <div>
            <h3 style={{marginBottom:"20px"}}>To‘lov usullari</h3>

            <div className="footer-payments">
              <div className="payment payme">
                Pay<span>me</span>
              </div>
              <div className="payment click">CLICK</div>
              <div className="payment mastercard">🔴 🟠</div>
              <div className="payment visa">VISA</div>
              <div className="payment uzcard">UZCARD</div>
            </div>
          </div>

          <div className="footer-social">
            <h3>Bizni kuzatib boring </h3>

            <div className="social-links">
              <a href="https://www.instagram.com/bellissimouz"
                 target="_blank" rel="noreferrer">◎</a>

              <a href="https://t.me/bellissimo_bot"
                 target="_blank" rel="noreferrer">➤</a>
            </div>
          </div>

        </div>

        <div className="footer-bottom">
          © 2016–2026 Bellissimo Pizza. Barcha huquqlar himoyalangan.
        </div>

      </footer>

    </>
  );
}

  document.getElementById("root")
